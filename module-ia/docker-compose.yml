version: '3.8'

# ============================================================
# Docker Compose — Orchestration locale de module-ia
# ============================================================
# Permet de démarrer les deux services ensemble :
#   docker compose up --build
# Ou séparément :
#   docker compose up voice-service
#   docker compose up comprehension-service
# ============================================================

services:
  voice-service:
    build:
      context: ./voice_service
      dockerfile: Dockerfile
    container_name: module_ia_voice
    ports:
      - "${VOICE_SERVICE_PORT:-8001}:8001"
    environment:
      - VOICE_DEFAULT_LANGUAGE=fr
      - WHISPER_MODEL_SIZE=base
      - VOICE_DEVICE=cpu
      - HF_HOME=/models/huggingface
      - MAX_AUDIO_SIZE_MB=50
    volumes:
      - ./models:/models
      - ./outputs:/app/outputs
    restart: unless-stopped
    networks:
      - module_ia_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  comprehension-service:
    build:
      context: ./comprehension_service
      dockerfile: Dockerfile
    container_name: module_ia_comprehension
    ports:
      - "${COMPREHENSION_SERVICE_PORT:-8002}:8002"
    environment:
      - FUZZY_MATCH_THRESHOLD=80.0
      - FUZZY_PARTIAL_THRESHOLD=85.0
      - DICTIONARIES_DIR=/app/data/dictionaries
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ./comprehension_service/data/dictionaries:/app/data/dictionaries
    restart: unless-stopped
    networks:
      - module_ia_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  module_ia_net:
    driver: bridge
